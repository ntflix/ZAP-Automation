services:
    zap:
        image: ghcr.io/zaproxy/zaproxy:stable
        container_name: zaproxy
        command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.key=supersecretapikey
        volumes:
            - ./zap.yaml:/zap/wrk/zap.yaml
        networks:
            - zap-tier

    coordinator:
        build: .
        depends_on:
            zap:
                condition: service_healthy
        volumes:
            - type: bind
              source: ./scanner_output
              target: /scanner_output
            - type: bind
              source: ./targets.csv
              target: /targets.csv
        environment:
            ZAP_HOST: zaproxy
            ZAP_PORT: 8080
            ZAP_API_KEY: supersecretapikey
        networks:
            - zap-tier

networks:
    zap-tier:

volumes:
  postgres_data: