services:
# docker run -u zap -p 8080:8080 -i zaproxy/zap-stable zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.key=<api-key>
    zap:
        image: ghcr.io/zaproxy/zaproxy:stable
        container_name: zaproxy
        command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.key=supersecretapikey
        volumes:
            - ./zap.yaml:/zap/wrk/zap.yaml
        networks:
            - zap-tier

    db:
        image: postgres:18
        container_name: postgres
        environment:
            POSTGRES_PASSWORD: supersecretpass
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - database
        healthcheck:
            test: ["CMD-SHELL", "pg_isready"]
            interval: 10s
            timeout: 5s
            retries: 5

    coordinator:
        build: .
        depends_on:
            zap:
                condition: service_healthy
            db:
                condition: service_healthy
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: supersecretpass
            POSTGRES_HOST: postgres
            POSTGRES_DB: securityscanner
            ZAP_HOST: zaproxy
            ZAP_PORT: 8080
            ZAP_API_KEY: supersecretapikey
        ports:
            - 8956:5000
        networks:
            - zap-tier
            - database

networks:
    zap-tier:
    database:

volumes:
  postgres_data: